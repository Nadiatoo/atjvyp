# 彪哥战法 - Qlib工作流配置
# 使用: qrun workflow_config_biaoge.yaml

qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn

market: &market csi300
benchmark: &benchmark SH000300

# 数据处理器配置
data_handler_config: &data_handler_config
  start_time: "2020-01-01"
  end_time: "2026-03-01"
  fit_start_time: "2020-01-01"
  fit_end_time: "2023-12-31"
  instruments: *market
  
  # 特征配置 - 彪哥战法特征
  learn_processors:
    - class: DropnaProcessor
      kwargs:
        fields_group: feature
    - class: CSZScoreNorm  # 截面标准化
      kwargs:
        fields_group: feature
  
  infer_processors:
    - class: CSZScoreNorm
      kwargs:
        fields_group: feature

# 回测配置
port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.strategy
    kwargs:
      topk: 50
      n_drop: 5
      signal: <PRED>
      
  backtest:
    start_time: "2024-01-01"
    end_time: "2026-03-01"
    account: 100000000  # 1亿初始资金
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095  # 涨跌停限制
      deal_price: close
      open_cost: 0.0005  # 万分之五
      close_cost: 0.0015  # 千分之1.5
      min_cost: 5

# 任务配置
task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158  # 使用Alpha158特征集
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train: ["2020-01-01", "2023-12-31"]
        valid: ["2024-01-01", "2024-06-30"]
        test: ["2024-07-01", "2026-03-01"]
        
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: {}
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
